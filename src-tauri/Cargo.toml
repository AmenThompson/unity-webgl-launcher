[package]
name = "unity-webgl-launcher"
version = "1.0.0"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
axum = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "net", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
serde = { version = "1", features = ["derive"] }
mime_guess = "2"
brotli-decompressor = "6"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
